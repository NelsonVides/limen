name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test

jobs:
  test:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: 'ubuntu-26.04'
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: '1.18'
            otp: '27'
          - elixir: '1.19'
            otp: '28'
          - elixir: '1.20'
            otp: '29'
            lint: true
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        id: setup-beam
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ steps.setup-beam.outputs.elixir-version }}-${{ steps.setup-beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: mix deps.unlock --check-unused
        if: matrix.lint
      # Also runs the boundary compiler: cross-boundary calls are warnings.
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
        if: matrix.lint
      - run: mix credo --strict
        if: matrix.lint
      - run: mix test --warnings-as-errors
      # The vendored solver, run under Node.js as a browser would run it.
      - run: mix test --only node
        if: matrix.lint
      # A flood of 10^6 unique IPv6 /64s must stay within the memory cap.
      - run: mix test --only flood
        if: matrix.lint
      # Bans propagate between two nodes.
      - run: mix test --only distributed
        if: matrix.lint

  dialyzer:
    name: Dialyzer
    runs-on: 'ubuntu-26.04'
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        id: setup-beam
        with:
          elixir-version: '1.20'
          otp-version: '29'
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            priv/plts
          key: ${{ runner.os }}-dialyzer-${{ steps.setup-beam.outputs.elixir-version }}-${{ steps.setup-beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: mix dialyzer --plt
      - run: mix dialyzer --format github

  docs:
    name: Docs
    runs-on: 'ubuntu-26.04'
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        id: setup-beam
        with:
          elixir-version: '1.20'
          otp-version: '29'
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-docs-${{ steps.setup-beam.outputs.elixir-version }}-${{ steps.setup-beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: mix docs --warnings-as-errors

  bench:
    name: Benchmarks
    runs-on: 'ubuntu-26.04'
    env:
      MIX_ENV: bench
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: erlef/setup-beam@v1
        id: setup-beam
        with:
          elixir-version: '1.20'
          otp-version: '29'
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-bench-${{ steps.setup-beam.outputs.elixir-version }}-${{ steps.setup-beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - name: Check out the base branch
        if: github.event_name == 'pull_request'
        run: git worktree add "$RUNNER_TEMP/base" "origin/${{ github.base_ref }}"
      # Alternate base and head so both sides see the same runner conditions.
      - name: Run benchmarks
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/bench/output"
          for run in 1 2; do
            if [ -f "$RUNNER_TEMP/base/bench/run.exs" ]; then
              (cd "$RUNNER_TEMP/base" && mix deps.get && mix bench --output "$out/base-$run.json")
            fi
            mix bench --output "$out/head-$run.json"
          done
      - name: Compare against the base branch
        if: github.event_name == 'pull_request' && hashFiles('bench/output/base-1.json') != ''
        run: >-
          mix run bench/compare.exs --threshold 0.10
          --base bench/output/base-1.json --base bench/output/base-2.json
          --head bench/output/head-1.json --head bench/output/head-2.json
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: benchmarks
          path: bench/output/
